<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 3 - Quản lý công việc</title>
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; }
    .box { max-width: 520px; margin: 24px auto; background: #fff; padding: 20px; border-radius: 10px; }
    .add { display: flex; gap: 6px; }
    .add input { flex: 1; padding: 6px; }
    .filters { margin: 12px 0; }
    .filters button.active { background: #2563eb; color: #fff; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #e5e7eb; }
    .done { text-decoration: line-through; color: #9ca3af; }
    .empty { color: #6b7280; }
    .info { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
    button:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="app" class="box">
    <h2>Công việc trong ngày</h2>
 
    <div class="add">
      <input type="text" v-model="tenMoi" @keyup.enter="themViec" placeholder="Nhập công việc...">
      <button @click="themViec">Thêm</button>
    </div>
    <div class="error" v-if="baoLoi" style="color:red;font-size:13px">{{ baoLoi }}</div>
 
    <div class="filters">
      <button v-for="b in boLoc" :key="b.value"
              :class="{ active: locHienTai === b.value }"
              @click="locHienTai = b.value">
        {{ b.ten }}
      </button>
    </div>
 
    <p class="empty" v-if="dsHienThi.length === 0">{{ thongBaoRong }}</p>
 
    <ul v-else>
      <li v-for="viec in dsHienThi" :key="viec.id">
        <label :class="{ done: viec.hoanThanh }">
          <input type="checkbox" v-model="viec.hoanThanh">
          {{ viec.ten }}
        </label>
        <button @click="xoaViec(viec.id)">Xóa</button>
      </li>
    </ul>
 
    <div class="info">
      <span>Tổng: {{ tongSoViec }} việc | Chưa hoàn thành: {{ soViecChuaXong }}</span>
      <button @click="xoaViecDaXong" :disabled="soViecChuaXong === tongSoViec">Xóa các việc đã hoàn thành</button>
    </div>
  </div>
 
  <script>
    const { createApp } = Vue
 
    createApp({
      data() {
        return {
          tenMoi: '',
          baoLoi: '',
          danhSach: [],      // mỗi việc: { id, ten, hoanThanh }
          idTiepTheo: 1,
          locHienTai: 'tatca',
          boLoc: [
            { value: 'tatca', ten: 'Tất cả' },
            { value: 'chuaxong', ten: 'Chưa hoàn thành' },
            { value: 'daxong', ten: 'Đã hoàn thành' }
          ]
        }
      },
      computed: {
        tongSoViec() {
          return this.danhSach.length
        },
        soViecChuaXong() {
          return this.danhSach.filter(v => !v.hoanThanh).length
        },
        dsHienThi() {
          if (this.locHienTai === 'chuaxong') return this.danhSach.filter(v => !v.hoanThanh)
          if (this.locHienTai === 'daxong') return this.danhSach.filter(v => v.hoanThanh)
          return this.danhSach
        },
        thongBaoRong() {
          if (this.tongSoViec === 0) return 'Chưa có công việc nào. Hãy thêm công việc mới!'
          if (this.locHienTai === 'chuaxong') return 'Không có công việc nào chưa hoàn thành.'
          return 'Chưa có công việc nào được hoàn thành.'
        }
      },
      methods: {
        themViec() {
          const ten = this.tenMoi.trim()
          if (ten === '') {
            this.baoLoi = 'Tên công việc không được để trống.'
            return
          }
          this.danhSach.push({ id: this.idTiepTheo++, ten: ten, hoanThanh: false })
          this.tenMoi = ''
          this.baoLoi = ''
        },
        xoaViec(id) {
          this.danhSach = this.danhSach.filter(v => v.id !== id)
        },
        xoaViecDaXong() {
          this.danhSach = this.danhSach.filter(v => !v.hoanThanh)
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
