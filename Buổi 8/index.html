<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sản phẩm</title>
    <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 16px; color: #222; }
        h1 { font-size: 24px; }
        form { display: grid; gap: 10px; padding: 16px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 20px; }
        label { display: grid; gap: 4px; font-weight: bold; font-size: 14px; }
        input { padding: 8px; font-size: 14px; border: 1px solid #aaa; border-radius: 4px; }
        .actions { display: flex; gap: 8px; }
        button { padding: 8px 14px; border: 0; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-save { background: #2563eb; color: #fff; }
        .btn-cancel { background: #e5e7eb; }
        .btn-edit { background: #f59e0b; color: #fff; }
        .btn-delete { background: #dc2626; color: #fff; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f3f4f6; }
        td.num { text-align: right; }
        .msg { padding: 10px; border-radius: 4px; margin-bottom: 14px; }
        .msg.error { background: #fee2e2; color: #991b1b; }
        .msg.ok { background: #dcfce7; color: #166534; }
        .empty { text-align: center; color: #666; }
    </style>
</head>
<body>
<div id="app">
    <h1>Quản lý sản phẩm</h1>

    <!-- Thông báo kết quả / lỗi -->
    <div v-if="message" class="msg" :class="messageType">{{ message }}</div>

    <!-- Biểu mẫu thêm / sửa -->
    <form @submit.prevent="save">
        <strong>{{ editingId === null ? 'Thêm sản phẩm' : 'Sửa sản phẩm (mã ' + editingId + ')' }}</strong>
        <label>Tên sản phẩm
            <input type="text" v-model="form.name" maxlength="100">
        </label>
        <label>Đơn giá (đồng)
            <input type="number" v-model.number="form.price">
        </label>
        <label>Số lượng tồn
            <input type="number" v-model.number="form.stock">
        </label>
        <div class="actions">
            <button type="submit" class="btn-save">Lưu</button>
            <button type="button" class="btn-cancel" v-if="editingId !== null" @click="resetForm">Hủy sửa</button>
        </div>
    </form>

    <!-- Bảng sản phẩm -->
    <table>
        <thead>
        <tr>
            <th>Tên sản phẩm</th>
            <th>Đơn giá (đồng)</th>
            <th>Số lượng tồn</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr v-for="p in products" :key="p.id">
            <td>{{ p.name }}</td>
            <td class="num">{{ formatPrice(p.price) }}</td>
            <td class="num">{{ p.stock }}</td>
            <td>
                <button class="btn-edit" @click="edit(p)">Sửa</button>
                <button class="btn-delete" @click="remove(p)">Xóa</button>
            </td>
        </tr>
        <tr v-if="products.length === 0">
            <td colspan="4" class="empty">Chưa có sản phẩm nào.</td>
        </tr>
        </tbody>
    </table>
</div>

<script>
const API_URL = 'api/products.php';

Vue.createApp({
    data() {
        return {
            products: [],
            form: { name: '', price: '', stock: '' },
            editingId: null,   // null: chế độ thêm; số: chế độ sửa
            message: '',
            messageType: 'ok'
        };
    },
    mounted() {
        this.loadProducts();   // gọi API khi mở trang
    },
    methods: {
        showMessage(text, type) {
            this.message = text;
            this.messageType = type;
        },
        formatPrice(value) {
            return Number(value).toLocaleString('vi-VN');
        },
        // Hàm gọi API dùng chung, luôn trả về đối tượng JSON {success, ...}
        async request(url, options = {}) {
            try {
                const res = await fetch(url, options);
                return await res.json();
            } catch (e) {
                return { success: false, message: 'Không kết nối được tới máy chủ hoặc phản hồi không hợp lệ.' };
            }
        },
        async loadProducts() {
            const result = await this.request(API_URL);
            if (result.success) {
                this.products = result.data;
            } else {
                this.showMessage(result.message, 'error');
            }
        },
        // Bấm Lưu: thêm (POST) hoặc sửa (PUT) tùy chế độ
        async save() {
            const isEdit = this.editingId !== null;
            const url = isEdit ? `${API_URL}?id=${this.editingId}` : API_URL;
            const result = await this.request(url, {
                method: isEdit ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(this.form)
            });
            if (result.success) {
                this.showMessage(result.message, 'ok');
                this.resetForm();
                await this.loadProducts();   // cập nhật bảng, không tải lại trang
            } else {
                this.showMessage(result.message, 'error');
            }
        },
        // Bấm Sửa: đưa dữ liệu dòng lên biểu mẫu
        edit(p) {
            this.editingId = p.id;
            this.form = { name: p.name, price: p.price, stock: p.stock };
            this.message = '';
        },
        // Bấm Xóa: xác nhận rồi mới gửi DELETE
        async remove(p) {
            if (!confirm(`Bạn có chắc muốn xóa "${p.name}" không?`)) {
                return;
            }
            const result = await this.request(`${API_URL}?id=${p.id}`, { method: 'DELETE' });
            if (result.success) {
                this.showMessage(result.message, 'ok');
                if (this.editingId === p.id) {
                    this.resetForm();
                }
                await this.loadProducts();
            } else {
                this.showMessage(result.message, 'error');
                await this.loadProducts();
            }
        },
        resetForm() {
            this.editingId = null;
            this.form = { name: '', price: '', stock: '' };
        }
    }
}).mount('#app');
</script>
</body>
</html>
